name: Build desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux
            path: |
              release/*.AppImage
              release/*.deb
          - os: macos-latest
            script: dist:mac
            artifact: macos
            path: release/*.dmg
          - os: windows-latest
            script: dist:win
            artifact: windows
            path: release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      # Set these as repository variables (Settings > Secrets and variables > Actions > Variables).
      # They are baked into the build, so use the production URLs.
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_CLOUD_URL: ${{ vars.VITE_CLOUD_URL }}
      # Unsigned builds: stop electron-builder from looking for a signing certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: api-documentation-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
