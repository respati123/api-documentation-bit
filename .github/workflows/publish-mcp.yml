name: Publish MCP package

# Publishes packages/api-documentation-mcp to npm. Runs on a tag like mcp-v0.1.1
# or manually. Authentication uses the NPM_TOKEN repository secret.
on:
  workflow_dispatch:
  push:
    tags:
      - 'mcp-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#mcp-v}"
          PKG_VERSION=$(node -p "require('./packages/api-documentation-mcp/package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - run: npm run build:mcp-package

      - name: Publish
        working-directory: packages/api-documentation-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
