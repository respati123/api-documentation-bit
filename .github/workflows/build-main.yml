name: Build desktop app on main

# Builds installers for Linux, macOS, and Windows on every push to main.
# Results are uploaded as workflow artifacts only. Releases are created
# manually with the "Release desktop app" workflow.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'packages/**'

permissions:
  contents: read

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux
            path: |
              release/*.AppImage
              release/*.deb
          - os: macos-latest
            script: dist:mac
            artifact: macos
            path: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            script: dist:win
            artifact: windows
            path: release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}
      VITE_CLOUD_URL: ${{ vars.VITE_CLOUD_URL }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run ${{ matrix.script }} -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-main-${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30
